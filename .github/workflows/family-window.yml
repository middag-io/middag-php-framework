name: Version family

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  php-version-family-check:
    permissions:
      contents: read
    uses: middag-io/actions/.github/workflows/php-version-family-check.yml@php-version-family-check-v1
    with:
      # The family window is the organization variable PHP_LIBS_OPEN_RELEASE
      # (empty = closed, X.Y = family MINOR window, X.0 = family MAJOR window).
      window: ${{ vars.PHP_LIBS_OPEN_RELEASE }}
      family-from: 2.0.0
