name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Self-contained release-please workflow.
#
# NOTE (ADR-006 deviation): the org pattern is a thin wrapper over the reusable
# workflows in middag-io/.github-private. A PUBLIC repository cannot consume
# reusable workflows from a PRIVATE repository, so the wrapper fails to start
# here with "error parsing called workflow ... release-please.yml@main". Until
# the reusable workflows are published to a PUBLIC repo (e.g. middag-io/.github),
# this repo inlines release-please so releases are not blocked.
# Matches the same fix applied to middag-php-ui/moodle/wordpress.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # QG-OSS-02: gate the release on a green CI run. `workflow_run` above only
    # fires after CI finishes; this guard requires success (workflow_dispatch
    # bypasses deliberately). Never publish a tag while CI is red.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
