name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Released php-library-check component of middag-io/actions, called by its
  # major tag. One job per PHP version: the static
  # checks (composer validate, strict PSR-4, PHPStan, PHP-CS-Fixer, Rector and
  # the portability gate) run on 8.2, the audit and PHPUnit on every version.
  # Every dependency resolves from public Packagist; no credentials.
  php-library-check:
    uses: middag-io/actions/.github/workflows/php-library-check.yml@php-library-check-v1
    permissions:
      contents: read
    with:
      php-versions: '["8.2", "8.3", "8.4"]'
      php-extensions: curl, intl, mbstring, pdo, pdo_sqlite, sqlite3
      composer-scripts: check:portability
      audit-blocking-severities: critical, high
