name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Static analysis & style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, intl, mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php8.2-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.2-vendor-

      # `middag-io/ui` resolves from public Packagist (Apache-2.0); no auth needed.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Test namespaces follow PSR-4 (autoload + autoload-dev)
        run: composer dump-autoload --optimize --strict-psr

      - name: Cache Rector (incremental analysis)
        uses: actions/cache@v4
        with:
          path: .cache/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock', '.php-rector.php') }}
          restore-keys: |
            ${{ runner.os }}-rector-

      - name: Cache PHPStan (result cache)
        uses: actions/cache@v4
        with:
          path: .cache/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock', '.phpstan.neon', 'phpstan-baseline.neon') }}
          restore-keys: |
            ${{ runner.os }}-phpstan-

      - name: PHPStan + PHP-CS-Fixer + Rector (dry-run)
        run: composer check

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, intl, mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPUnit
        run: composer test
